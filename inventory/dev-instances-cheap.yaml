# Cheaper reviewer profile (still meets Task 1 diversity rules).
# Use: instance_inventory_file = "inventory/dev-instances-cheap.yaml"

web-a:
  instance_type: t3.micro
  root_volume_type: gp3
  root_volume_size: 8
  root_throughput: 125
  key_name: arrise-web-a
  associate_public_ip_address: true
  tags:
    Workload: web
    Profile: cheap-reviewer

web-b:
  instance_type: t3.small
  root_volume_type: gp2
  root_volume_size: 10
  key_name: arrise-web-b
  associate_public_ip_address: true
  tags:
    Workload: web
    Profile: cheap-reviewer

worker-a:
  instance_type: t2.micro
  root_volume_type: standard
  root_volume_size: 12
  key_name: arrise-worker-a
  tags:
    Workload: worker
    Profile: cheap-reviewer

batch-a:
  instance_type: t3.medium
  root_volume_type: io1
  root_volume_size: 20
  root_iops: 100
  key_name: arrise-batch-a
  tags:
    Workload: batch
    Profile: cheap-reviewer

ledger-a:
  instance_type: t3.large
  root_volume_type: io2
  root_volume_size: 30
  root_iops: 100
  key_name: arrise-ledger-a
  disable_api_termination: true
  protected: true
  tags:
    Workload: ledger
    Profile: cheap-reviewer
    Criticality: high
