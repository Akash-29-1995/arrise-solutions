# Validation runs via terraform-validate.yml instead.
#
# This file exists only to overwrite the broken template on main.
# Safe to delete after terraform-validate.yml is active on the default branch.

name: Makefile CI (disabled)

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Point reviewers to the real workflow
        run: |
          echo "Use the 'Terraform Validate' workflow (terraform-validate.yml)."
          echo "This Makefile CI template was disabled because this is not an autotools project."
